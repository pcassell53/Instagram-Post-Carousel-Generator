<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instagram Carousel Demo Output</title>
</head>
<body>
<style>
.instagram-carousel-wrap {
    position: relative;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 55px;
    overflow: hidden;
}

.instagram-carousel-track {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    overflow-anchor: none;
    margin: 0 auto;
    padding: 0 2px 20px;
}

.instagram-carousel-track::-webkit-scrollbar {
    display: none;
}

.instagram-carousel-track {
    -ms-overflow-style: none;
    scrollbar-width: none;
}

.instagram-slide {
    flex: 0 0 calc((100% - 40px) / 3);
    max-width: calc((100% - 40px) / 3);
    min-width: 0;
    box-sizing: border-box;
    scroll-snap-align: start;
    scroll-snap-stop: always;
}

.instagram-slide .instagram-media {
    margin: 0 auto !important;
    min-width: 0 !important;
    max-width: 540px !important;
    width: 100% !important;
}

.instagram-slide iframe {
    max-width: 100% !important;
}

.instagram-carousel-arrow {
    position: absolute;
    top: 50%;
    z-index: 20;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #1f2937;
    color: #fff;
    font-size: 28px;
    line-height: 44px;
    text-align: center;
    transform: translateY(-50%);
    cursor: pointer;
}

.instagram-carousel-prev {
    left: 0;
}

.instagram-carousel-next {
    right: 0;
}

.instagram-carousel-arrow:hover,
.instagram-carousel-arrow:focus {
    background: #374151;
    color: #fff;
    outline: 2px solid #2563eb;
    outline-offset: 2px;
}

.instagram-carousel-arrow:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

@media (max-width: 991px) {
    .instagram-slide {
        flex: 0 0 calc((100% - 20px) / 2);
        max-width: calc((100% - 20px) / 2);
    }
}

@media (max-width: 767px) {
    .instagram-carousel-wrap {
        padding: 0 42px;
    }

    .instagram-carousel-track {
        gap: 20px;
    }

    .instagram-slide {
        flex: 0 0 100%;
        max-width: 100%;
    }

    .instagram-carousel-arrow {
        width: 36px;
        height: 36px;
        font-size: 22px;
        line-height: 36px;
    }
}
</style>

<div class="text-center pad-vert-2x instagram-carousel-section">
    <div class="instagram-carousel-wrap">
        <button type="button" class="instagram-carousel-arrow instagram-carousel-prev" aria-label="Previous Instagram post">
            <span aria-hidden="true">&#10094;</span>
        </button>

        <div class="instagram-carousel-track">
            <div class="instagram-slide">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DZ7nrziALx6/" data-instgrm-version="14">
                    <a href="https://www.instagram.com/reel/DZ7nrziALx6/" target="_blank" rel="noopener">View this reel on Instagram</a>
                </blockquote>
            </div>

            <div class="instagram-slide">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/DZ3fT3oFfW6/" data-instgrm-version="14">
                    <a href="https://www.instagram.com/p/DZ3fT3oFfW6/" target="_blank" rel="noopener">View this post on Instagram</a>
                </blockquote>
            </div>

            <div class="instagram-slide">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DZvdHTlyqY-/" data-instgrm-version="14">
                    <a href="https://www.instagram.com/reel/DZvdHTlyqY-/" target="_blank" rel="noopener">View this reel on Instagram</a>
                </blockquote>
            </div>

            <div class="instagram-slide">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/DZuuMLdkc3a/" data-instgrm-version="14">
                    <a href="https://www.instagram.com/p/DZuuMLdkc3a/" target="_blank" rel="noopener">View this post on Instagram</a>
                </blockquote>
            </div>

            <div class="instagram-slide">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/reel/DZtLcbkAXcg/" data-instgrm-version="14">
                    <a href="https://www.instagram.com/reel/DZtLcbkAXcg/" target="_blank" rel="noopener">View this reel on Instagram</a>
                </blockquote>
            </div>

            <div class="instagram-slide">
                <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/DZgNWPmDw5r/" data-instgrm-version="14">
                    <a href="https://www.instagram.com/p/DZgNWPmDw5r/" target="_blank" rel="noopener">View this post on Instagram</a>
                </blockquote>
            </div>
        </div>

        <button type="button" class="instagram-carousel-arrow instagram-carousel-next" aria-label="Next Instagram post">
            <span aria-hidden="true">&#10095;</span>
        </button>
    </div>

    <script async src="https://www.instagram.com/embed.js"></script>
</div>

<script>
(function() {
    function ready(callback) {
        if (document.readyState !== "loading") {
            callback();
        } else {
            document.addEventListener("DOMContentLoaded", callback);
        }
    }

    function processInstagramEmbeds() {
        if (window.instgrm && window.instgrm.Embeds) {
            window.instgrm.Embeds.process();
        }
    }

    function setupInstagramCarousel(section) {
        var track = section.querySelector(".instagram-carousel-track");
        var prevButton = section.querySelector(".instagram-carousel-prev");
        var nextButton = section.querySelector(".instagram-carousel-next");

        if (!track || !prevButton || !nextButton) {
            return;
        }

        var slides = Array.prototype.slice.call(track.querySelectorAll(".instagram-slide"));
        var currentIndex = 0;
        var scrollFrame = null;

        function getVisibleCount() {
            if (!slides.length) {
                return 1;
            }

            var trackWidth = track.getBoundingClientRect().width;
            var slideWidth = slides[0].getBoundingClientRect().width;
            var trackStyle = window.getComputedStyle(track);
            var gap = parseFloat(trackStyle.columnGap || trackStyle.gap) || 0;

            if (!slideWidth) {
                return 1;
            }

            return Math.max(1, Math.round((trackWidth + gap) / (slideWidth + gap)));
        }

        function getMaxIndex() {
            return Math.max(0, slides.length - getVisibleCount());
        }

        function getTargetLeft(index) {
            var trackRect = track.getBoundingClientRect();
            var slideRect = slides[index].getBoundingClientRect();

            return track.scrollLeft + (slideRect.left - trackRect.left);
        }

        function updateButtons() {
            var maxIndex = getMaxIndex();

            if (currentIndex > maxIndex) {
                currentIndex = maxIndex;
            }

            prevButton.disabled = currentIndex <= 0;
            nextButton.disabled = currentIndex >= maxIndex;
        }

        function syncIndexToScroll() {
            var trackRect = track.getBoundingClientRect();
            var closestIndex = 0;
            var closestDistance = Infinity;

            for (var i = 0; i < slides.length; i++) {
                var slideRect = slides[i].getBoundingClientRect();
                var distance = Math.abs(slideRect.left - trackRect.left);

                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestIndex = i;
                }
            }

            currentIndex = Math.min(closestIndex, getMaxIndex());
            updateButtons();
        }

        function goToIndex(index, animate) {
            currentIndex = Math.max(0, Math.min(index, getMaxIndex()));

            if (!slides[currentIndex]) {
                updateButtons();
                return;
            }

            track.scrollTo({
                left: getTargetLeft(currentIndex),
                behavior: animate === false ? "auto" : "smooth"
            });

            updateButtons();
        }

        prevButton.addEventListener("click", function() {
            goToIndex(currentIndex - 1, true);
        });

        nextButton.addEventListener("click", function() {
            goToIndex(currentIndex + 1, true);
        });

        track.addEventListener("scroll", function() {
            if (scrollFrame) {
                window.cancelAnimationFrame(scrollFrame);
            }

            scrollFrame = window.requestAnimationFrame(function() {
                syncIndexToScroll();
            });
        });

        window.addEventListener("resize", function() {
            goToIndex(currentIndex, false);
        });

        updateButtons();

        setTimeout(function() {
            processInstagramEmbeds();
            goToIndex(currentIndex, false);
        }, 500);

        setTimeout(function() {
            processInstagramEmbeds();
            goToIndex(currentIndex, false);
        }, 1500);

        setTimeout(function() {
            processInstagramEmbeds();
            goToIndex(currentIndex, false);
        }, 3000);
    }

    ready(function() {
        var sections = document.querySelectorAll(".instagram-carousel-section");

        for (var i = 0; i < sections.length; i++) {
            setupInstagramCarousel(sections[i]);
        }
    });

    window.addEventListener("load", function() {
        processInstagramEmbeds();
    });
})();
</script>
</body>
</html>
